name: pal
description: Portable Ambient Link - UI and Visualizer Host
publish_to: 'none' # Prevents accidental publishing to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0

  # Native C++ Integration
  ffi: ^2.1.2

  # Networking & Real-Time Data Streaming
  http: ^1.2.0
  web_socket_channel: ^3.0.0

  # State Management & UI Utilities
  provider: ^6.1.2
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Automatic Dart Binding Generator for C Headers
  ffigen: ^11.0.0

flutter:
  uses-material-design: true

  # # Asset declaration for Standby Mode artwork and fallbacks
  # assets:
  #   # - assets/images/